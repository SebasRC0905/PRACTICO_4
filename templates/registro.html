{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}

<div class="tarjeta tarjeta-angosta animar-entrada">
    <p class="eyebrow">nuevo usuario</p>
    <h1>Crear cuenta</h1>

    <form method="POST" action="{{ url_for('registro') }}" class="formulario">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required autofocus>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="5" max="120" required>

        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <button type="submit" class="boton boton-principal">Crear cuenta</button>
    </form>

    <p class="enlace-secundario">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</div>

{% endblock %}
