<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Indicador de Racha</title>
    <style>
        :root {
            --bg: #12141c;
            --superficie: #1a1d29;
            --superficie-2: #20232f;
            --borde: #2a2e3d;
            --texto: #e8e9ee;
            --texto-tenue: #8b8f9c;
            --acento: #5eead4;
            --acento-fondo: rgba(94, 234, 212, 0.12);
            --error: #fb7185;
            --fuente-mono: "JetBrains Mono", monospace;
            --fuente-texto: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--texto);
            font-family: var(--fuente-texto);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .demo-seccion {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .etiqueta {
            color: var(--texto-tenue);
            font-size: 13px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .contador {
            font-family: var(--fuente-mono);
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--acento);
        }

        .botones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--acento);
            color: #0a0c12;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-family: var(--fuente-mono);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(94, 234, 212, 0.2);
        }

        /* Indicador de racha */

        #indicador-racha {
            display: none;
            position: fixed;
            top: 40px;
            right: 40px;
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 50px;
            padding: 12px 20px;
            align-items: center;
            gap: 10px;
            z-index: 100;
            animation: aparecer-racha 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        #indicador-racha.activo {
            display: flex;
        }

        .icono-racha {
            font-size: 20px;
            animation: pulsar-fuego 0.6s ease-in-out infinite;
        }

        .texto-racha {
            font-family: var(--fuente-mono);
            font-size: 14px;
            color: var(--texto);
            font-weight: 600;
        }

        #contador-racha {
            color: var(--acento);
            font-weight: 700;
        }

        @keyframes aparecer-racha {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulsar-fuego {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        .info {
            background: var(--acento-fondo);
            border: 1px solid var(--acento);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--texto);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Demo: Indicador de Racha 🔥</h1>

        <div class="demo-seccion">
            <div class="etiqueta">Palabras Correctas Consecutivas</div>
            <div class="contador">Racha: <span id="contador">0</span> / 4</div>
            <div class="botones">
                <button onclick="agregarCorrecta()">+ Palabra Correcta</button>
                <button onclick="agregarIncorrecta()">- Error (Reset)</button>
                <button onclick="resetear()">Reset</button>
            </div>
            <div class="info">
                Haz clic en "+ Palabra Correcta" 4 veces consecutivas para ver el indicador de racha apareciendo en la esquina superior derecha con animación suave.
            </div>
        </div>
    </div>

    <div id="indicador-racha">
        <span class="icono-racha">🔥</span>
        <span class="texto-racha">Racha de <span id="contador-racha">4</span></span>
    </div>

    <script>
        let palabrasCorrectasConsecutivas = 0;
        const UMBRAL_RACHA = 4;
        const indicadorRacha = document.getElementById("indicador-racha");
        const contadorRacha = document.getElementById("contador-racha");
        const contador = document.getElementById("contador");

        function actualizarVista() {
            contador.textContent = palabrasCorrectasConsecutivas;
            contadorRacha.textContent = palabrasCorrectasConsecutivas;
        }

        function mostrarRacha() {
            indicadorRacha.classList.add("activo");
        }

        function ocultarRacha() {
            indicadorRacha.classList.remove("activo");
            palabrasCorrectasConsecutivas = 0;
            actualizarVista();
        }

        function agregarCorrecta() {
            palabrasCorrectasConsecutivas += 1;
            actualizarVista();

            if (palabrasCorrectasConsecutivas >= UMBRAL_RACHA) {
                mostrarRacha();
            }
        }

        function agregarIncorrecta() {
            ocultarRacha();
        }

        function resetear() {
            ocultarRacha();
        }

        actualizarVista();
    </script>
</body>
</html>
